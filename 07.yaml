AWSTemplateFormatVersion: "2010-09-09"
Description: sg

Parameters:
  Route:
    Type: String
    Default: route


Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to client host
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${Route}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp 
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

Outputs:
  SecurityGroupId:
    Value: !Ref InstanceSecurityGroup
    Export: 
      Name: !Sub "${AWS::StackName}-SecurityGroupId"