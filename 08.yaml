AWSTemplateFormatVersion: 2010-09-09
Description: A sample CloudFormation template with YAML comments.

Parameters:
  NetworkStackName:
    Type: String
    Default: route
  AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  SecurityStackName:
    Type: String
    Default: sg

Resources:
  MyEC2Instance: 
    Type: AWS::EC2::Instance
    Properties: 
      SubnetId: 
        Fn::ImportValue: 
          Fn::Sub:
            "${NetworkStackName}-PublicSubnetId"
      ImageId: !Ref AMI
      SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: "${SecurityStackName}-SecurityGroupId"
      InstanceType: t3.micro
      KeyName: test-ec2