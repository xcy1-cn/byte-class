AWSTemplateFormatVersion: "2010-09-09"
Description: Create one VPC with dev and pro subnets

Parameters:
  ProjectName:
    Type: String
    Default: cfn
    AllowedValues:
      - cfn
      - practice

Mappings:
  SubnetConfig:
    dev:
      Cidr: 10.0.1.0/24

    pro:
      Cidr: 10.0.2.0/24

Resources:
  CfnVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  DevSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CfnVPC
      CidrBlock: !FindInMap
        - SubnetConfig
        - dev
        - Cidr
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-subnet"

  ProSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CfnVPC
      CidrBlock: !FindInMap
        - SubnetConfig
        - pro
        - Cidr
      AvailabilityZone: ap-northeast-1c
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-pro-subnet"